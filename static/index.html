<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess-to-Muscle</title>
<style>
  :root {
    --bg:#0c0e12; --panel:#14171d; --panel2:#1a1e26; --line:#262b35; --ink:#eceff4; --dim:#8b93a1;
    --lime:#b6f23a; --amber:#f5b942; --red:#f2645a; --blue:#6ab7ff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--line); }
  .brand { font-weight:800; letter-spacing:.14em; font-size:14px; }
  .brand b { color:var(--lime); }
  .profile { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; color:var(--dim); }
  select, input[type=number], input[type=text] { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font:inherit; }
  input[type=number] { width:84px; }
  main { display:grid; grid-template-columns:minmax(320px,430px) 1fr; gap:20px; padding:20px 24px; max-width:1200px; margin:auto; }
  @media (max-width:860px) { main { grid-template-columns:1fr; padding:16px; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card h2 { margin:0 0 12px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .coach { position:sticky; top:16px; align-self:start; }
  .say { min-height:110px; font-size:18px; line-height:1.55; }
  .you { color:var(--dim); font-size:13px; font-style:italic; margin:10px 0 0; min-height:20px; }
  .logged { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; min-height:26px; }
  .tag { font-size:12px; padding:3px 10px; border-radius:99px; background:#1d2a12; color:var(--lime); border:1px solid #33481c; }
  .tag.warn { background:#2b2210; color:var(--amber); border-color:#4a3a14; }
  .controls { display:flex; gap:10px; align-items:center; margin-top:14px; }
  #mic { width:64px; height:64px; border-radius:50%; border:0; background:var(--lime); color:#0c0e12; font-size:26px; cursor:pointer; flex:none; transition:transform .15s; }
  #mic:hover { transform:scale(1.05); }
  #mic.rec { background:var(--red); color:#fff; animation:pulse 1.1s infinite; }
  #mic:disabled { opacity:.5; cursor:wait; }
  @keyframes pulse { 50% { box-shadow:0 0 0 14px rgba(242,100,90,.2); } }
  .controls input { flex:1; min-width:0; }
  button.sm { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 12px; cursor:pointer; font:inherit; font-size:13px; }
  button.sm:hover { border-color:var(--lime); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip { font-size:12px; padding:5px 11px; border-radius:99px; background:transparent; color:var(--dim); border:1px solid var(--line); cursor:pointer; }
  .chip:hover { color:var(--ink); border-color:var(--lime); }
  .dash { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; align-content:start; }
  .wide { grid-column:1 / -1; }
  .ringrow { display:flex; gap:16px; align-items:center; }
  .big { font-size:30px; font-weight:800; line-height:1.1; } .big small { font-size:14px; color:var(--dim); font-weight:500; }
  .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  .bar { height:8px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-top:10px; }
  .bar > i { display:block; height:100%; background:var(--lime); border-radius:99px; transition:width .6s; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:14px; }
  .row:first-of-type { border-top:0; }
  .badge { font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; align-self:center; }
  .b-ok { background:#1d2a12; color:var(--lime); } .b-warn { background:#2b2210; color:var(--amber); } .b-bad { background:#2d1513; color:var(--red); } .b-info { background:#10243a; color:var(--blue); }
  .vol { display:grid; grid-template-columns:70px 1fr 34px; gap:10px; align-items:center; margin:7px 0; font-size:13px; }
  .track { position:relative; height:10px; background:var(--panel2); border-radius:99px; }
  .track .band { position:absolute; left:33.3%; width:50%; top:0; bottom:0; background:rgba(182,242,58,.12); border-radius:99px; }
  .track i { position:absolute; left:0; top:0; bottom:0; border-radius:99px; transition:width .6s; }
  .empty { color:var(--dim); font-size:14px; }
  .suggest { display:flex; flex-wrap:wrap; gap:8px; }
  .suggest span { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:7px 12px; font-size:13px; }
  .suggest b { color:var(--lime); }
</style>
</head>
<body>
<header>
  <div class="brand">MESS<b>→</b>MUSCLE</div>
  <div class="profile">
    Goal <select id="goal"><option value="bulk">Bulk</option><option value="maintain">Maintain</option><option value="cut">Cut</option></select>
    Level <select id="exp"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option></select>
    Weight <input type="number" id="bw" placeholder="kg" step="0.1" min="30" max="200">
    Mic language <select id="lang"><option value="unknown">Auto</option><option value="en-IN">English</option><option value="hi-IN">Hindi</option></select>
  </div>
</header>

<main>
  <section class="card coach">
    <h2>Your coach</h2>
    <div class="say" id="say">Tell me what you lifted, ate or slept, or ask what to do next. Try: "bench 40 kg 10 reps, kya badhaun?"</div>
    <div class="you" id="you"></div>
    <div class="logged" id="logged"></div>
    <div class="controls">
      <button id="mic" title="Click to talk, click again to send">🎙</button>
      <input type="text" id="txt" placeholder="or type here…">
      <button class="sm" id="send">Send</button>
      <button class="sm" id="replay" title="Replay voice" style="display:none">🔊</button>
    </div>
    <div class="chips">
      <button class="chip">bench 60 x 8, 8, 6 aur squat 80 kilo 3 sets of 5</button>
      <button class="chip">aaj lunch mein 4 roti, rajma, dahi aur 2 anda khaya</button>
      <button class="chip">slept 4 hours, midsem in 3 days, what should I do?</button>
      <button class="chip">bench 40 kg 10 reps, kya badhaun?</button>
    </div>
  </section>

  <section class="dash">
    <div class="card"><h2>Protein today</h2><div id="protein"></div></div>
    <div class="card"><h2>Calories</h2><div id="cal"></div></div>
    <div class="card"><h2>Today's mode</h2><div id="mode"></div></div>
    <div class="card"><h2>Next targets</h2><div id="targets"></div></div>
    <div class="card"><h2>Sets this week</h2><div id="volume"></div></div>
    <div class="card"><h2>Eat this next</h2><div id="ideas"></div></div>
  </section>
</main>
<audio id="player"></audio>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const history = [];
let rec, chunks = [], typer, busy = false, lastAudio = null;

/* ---------- dashboard ---------- */
function ring(pct) {
  const C = 2 * Math.PI * 46, off = C * (1 - Math.min(pct, 1));
  return `<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="var(--panel2)" stroke-width="10"/>
    <circle cx="55" cy="55" r="46" fill="none" stroke="var(--lime)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 55 55)" style="transition:stroke-dashoffset .6s"/>
    <text x="55" y="61" text-anchor="middle" fill="var(--ink)" font-size="20" font-weight="800">${Math.round(Math.min(pct, 1) * 100)}%</text></svg>`;
}

function render(s) {
  const n = s.nutrition, p = n.protein;
  $("protein").innerHTML = `<div class="ringrow">${ring(p.eaten_g / p.target_g)}<div>
      <div class="big">${Math.round(p.eaten_g)}<small> / ${p.target_g} g</small></div>
      <div class="sub">${p.remaining_g > 0 ? Math.round(p.remaining_g) + " g to go" : "Target hit ✓"}</div>
      <div class="sub">Based on ${n.bodyweight_kg} kg${n.bodyweight_assumed ? " (assumed, set your weight)" : ""}</div></div></div>
    ${p.unknown_foods.length ? `<div class="sub" style="color:var(--amber)">Not counted: ${p.unknown_foods.map(esc).join(", ")}</div>` : ""}
    ${p.assumed_portions.length ? `<div class="sub">Assumed 1 portion: ${p.assumed_portions.map(esc).join(", ")}</div>` : ""}`;

  const c = n.calories;
  $("cal").innerHTML = `<div class="big">${c.eaten}<small> / ${c.target} kcal</small></div>
    <div class="bar"><i style="width:${Math.min(c.eaten / c.target * 100, 100)}%"></i></div>
    <div class="sub">${esc(n.trend.message)}</div>`;

  const ex = s.exam, rc = s.recovery;
  const exCls = { none:"b-ok", normal:"b-ok", taper:"b-warn", maintenance:"b-warn", rest:"b-bad", ramp_back:"b-info" }[ex.phase];
  const rcCls = { normal:"b-ok", light:"b-warn", deload:"b-bad" }[rc.state];
  $("mode").innerHTML = `<div class="row"><span>${esc(ex.message)}</span><span class="badge ${exCls}">${ex.phase.replace("_", " ")}</span></div>
    <div class="row"><span>${esc(rc.message)}</span><span class="badge ${rcCls}">${rc.state}</span></div>
    <div class="sub">Volume ×${s.modifiers.volume_factor}${s.modifiers.sessions_per_week != null ? " · " + s.modifiers.sessions_per_week + " sessions/week" : ""}</div>`;

  $("targets").innerHTML = s.next_targets.length ? s.next_targets.map(t => {
    const cls = { increase:"b-ok", add_rep:"b-info", add_reps:"b-info", add_weight:"b-ok", repeat:"b-warn", deload:"b-bad", log_more:"b-info" }[t.action] || "b-info";
    const kg = t.today_kg ?? t.next_kg;
    return `<div class="row"><span><b>${esc(t.exercise)}</b><br><span class="sub">${kg != null ? kg + " kg × " : ""}${t.target_reps ?? ""} reps${t.today_kg ? " (light day)" : ""}${t.plateau ? " · plateau" : ""}</span></span>
      <span class="badge ${cls}">${t.action.replace("_", " ")}</span></div>`;
  }).join("") : `<div class="empty">Log a lift to get a target.</div>`;

  const groups = ["chest", "back", "legs", "shoulders", "arms"], sets = s.volume.sets_by_muscle;
  $("volume").innerHTML = groups.map(g => {
    const v = sets[g] || 0, col = v >= 8 && v <= 20 ? "var(--lime)" : v > 20 ? "var(--red)" : "var(--amber)";
    return `<div class="vol"><span>${g}</span><div class="track"><div class="band"></div><i style="width:${Math.min(v / 24 * 100, 100)}%;background:${col}"></i></div><b>${v}</b></div>`;
  }).join("") + `<div class="sub">Green zone = 8–20 sets/week</div>` + s.volume.warnings.map(w => `<div class="sub" style="color:var(--amber)">${esc(w)}</div>`).join("");

  $("ideas").innerHTML = n.suggestions.length
    ? `<div class="suggest">${n.suggestions.map(x => `<span>${esc(x.meal)} <b>${x.protein_g} g</b></span>`).join("")}</div>`
    : `<div class="empty">${p.remaining_g > 0 ? "Log your meals to get ideas." : "Protein target met. Nice."}</div>`;
}

async function loadStatus() { render(await (await fetch("/api/status")).json()); }

async function loadProfile() {
  const p = await (await fetch("/api/profile")).json();
  $("goal").value = p.goal; $("exp").value = p.experience; $("bw").value = p.bodyweight_kg ?? "";
}
async function saveProfile() {
  await fetch("/api/profile", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ goal:$("goal").value, experience:$("exp").value, bodyweight_kg:$("bw").value || null }) });
  loadStatus();
}
["goal", "exp", "bw"].forEach(id => $(id).onchange = saveProfile);

/* ---------- coach ---------- */
const seg = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter() : null;
function typeSay(text) {
  clearInterval(typer);
  const chars = seg ? Array.from(seg.segment(text), x => x.segment) : Array.from(text);
  const el = $("say"); el.textContent = ""; let i = 0;
  typer = setInterval(() => { el.textContent += chars[i++] ?? ""; if (i >= chars.length) clearInterval(typer); }, 22);
}

function fmtLogged(e) {
  const tags = [];
  (e.workouts || []).forEach(w => tags.push(`${w.exercise}: ${w.sets.map(s => (s.kg ?? "BW") + "×" + s.reps).join(", ")}`));
  (e.meals || []).forEach(m => tags.push(`${m.qty ?? ""} ${m.item}`.trim()));
  if (e.sleep_hours != null) tags.push(`sleep ${e.sleep_hours}h`);
  if (e.exam_in_days != null) tags.push(`exam in ${e.exam_in_days}d`);
  if (e.bodyweight_kg) tags.push(`${e.bodyweight_kg} kg`);
  return tags;
}

async function send(form) {
  if (busy) return; busy = true; $("mic").disabled = true;
  $("say").textContent = "Thinking…"; $("you").textContent = ""; $("logged").innerHTML = "";
  form.append("language", $("lang").value);
  form.append("history", JSON.stringify(history.slice(-6)));
  try {
    const r = await fetch("/api/coach", { method:"POST", body:form });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Server error");
    $("you").textContent = "You: " + d.transcript;
    $("logged").innerHTML = (d.logged ? fmtLogged(d.logged).map(t => `<span class="tag">✓ ${esc(t)}</span>`) : [])
      .concat((d.warnings || []).map(w => `<span class="tag warn">⚠ ${esc(w)}</span>`)).join("");
    history.push({ role:"user", content:d.transcript }, { role:"assistant", content:d.reply.say });
    typeSay(d.reply.say);
    render(d.status);
    lastAudio = d.audio; $("replay").style.display = lastAudio ? "" : "none";
    if (lastAudio) play();
  } catch (e) { $("say").textContent = "Something went wrong: " + e.message; }
  finally { busy = false; $("mic").disabled = false; }
}
function play() { const p = $("player"); p.src = "data:audio/wav;base64," + lastAudio; p.play(); }
$("replay").onclick = play;

function sendText(t) { t = t.trim(); if (!t) return; const f = new FormData(); f.append("text", t); $("txt").value = ""; send(f); }
$("send").onclick = () => sendText($("txt").value);
$("txt").onkeydown = e => { if (e.key === "Enter") sendText($("txt").value); };
document.querySelectorAll(".chip").forEach(c => c.onclick = () => sendText(c.textContent));

$("mic").onclick = async () => {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); $("mic").classList.remove("rec");
      const f = new FormData(); f.append("audio", new Blob(chunks, { type: rec.mimeType }), "audio.webm"); send(f);
    };
    rec.start(); $("mic").classList.add("rec"); $("say").textContent = "Listening… click the mic again to send.";
  } catch (e) { $("say").textContent = "Mic blocked (" + e.message + "). Type instead."; }
};

loadProfile(); loadStatus();
</script>
</body>
</html>
